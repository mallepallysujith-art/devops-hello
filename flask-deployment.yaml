apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-hello
  template:
    metadata:
      labels:
        app: devops-hello
    spec:
      containers:
      - name: devops-hello
        image: msujithreddy/devops-hello:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-hello-service
spec:
  type: NodePort
  selector:
    app: devops-hello
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30007
